---
name: gnosisvpn
arch: "${NFPM_ARCHITECTURE}"
platform: linux
version: "${GNOSISVPN_PACKAGE_VERSION}"
# None, because 'semver' strips zeros (2026.05.27 -> 2026.5.27)
version_schema: none
section: net
priority: optional
maintainer: Hoprnet <tech@hoprnet.org>
description: |
  Decentralized, trustless, uncensorable VPN for the web3 age.
  Fully anonymous browsing over a decentralized mixnet.
license: GNU General Public License v3.0
homepage: https://vpn.gnosis.eth.limo/
# The rpm signature block is appended by generate-package-linux.sh, only for signed rpm builds.
overrides:
  deb:
    depends:
      - libc6
      - systemd
      - iptables
      - logrotate
      - ca-certificates
      - libwebkit2gtk-4.1-0
      # Ubuntu 24.04+ renamed libgtk-3-0 to libgtk-3-0t64 (64-bit time_t
      # transition); keep the old name as a fallback for pre-noble systems.
      - libgtk-3-0t64 | libgtk-3-0
      - libayatana-appindicator3-1
      - libglib2.0-bin
  rpm:
    # Library provides for webkit and the tray library: Fedora and EPEL 10 name these packages differently.
    depends:
      - systemd
      - logrotate
      - ca-certificates
      - glib2
      - gtk3
      - libwebkit2gtk-4.1.so.0()(64bit)
      # The app loads either tray library at runtime.
      - (libayatana-appindicator3.so.1()(64bit) or libappindicator3.so.1()(64bit))
  archlinux:
    depends:
      - logrotate
      - webkit2gtk-4.1
      - gtk3
      - libayatana-appindicator
      - glib2
contents:
  # Binaries
  - src: ./build/download/gnosis_vpn-root
    dst: /usr/bin/gnosis_vpn-root
    file_info:
      mode: 0750
      owner: root
      group: root
  - src: ./build/download/gnosis_vpn-worker
    dst: /usr/bin/gnosis_vpn-worker
    file_info:
      mode: 0755
  - src: ./build/download/gnosis_vpn-ctl
    dst: /usr/bin/gnosis_vpn-ctl
    file_info:
      mode: 0755
  - src: ./build/gnosis_vpn-app
    dst: /usr/bin/gnosis_vpn-app
    file_info:
      mode: 0755
  # Reads the installed version and update manifests for the app. Needs no
  # privileges for either; `update` has no engine on Linux and refuses, so
  # there is no sudoers entry to go with it. Root-owned, unlike the binaries
  # above, so the service account cannot swap what runs privileged on macOS.
  - src: ./build/download/gnosis_vpn-update
    dst: /usr/bin/gnosis_vpn-update
    file_info:
      mode: 0755
      owner: root
      group: root
  # Run by postinstall.sh to move the legacy identity into the installing user's home; root-only, no sudoers entry.
  - src: ./build/download/gnosis_vpn-migrate
    dst: /usr/bin/gnosis_vpn-migrate
    file_info:
      mode: 0755
      owner: root
      group: root
  # Resource files
  - src: ./build/resources/version.txt
    dst: /etc/gnosisvpn/version.txt
    file_info:
      mode: 0644
      owner: root
      group: root
  # Dearmored signing public key, used by postinstall.sh to register the APT
  # source so `apt-get update` sees future versions after a manual `dpkg -i`.
  - src: ./build/resources/gnosisvpn-archive-keyring.gpg
    dst: /usr/share/gnosisvpn/gnosisvpn-archive-keyring.gpg
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root
  # Armored signing public key, referenced by the gpgkey= line of the dnf repo that postinstall.sh registers.
  - src: ./build/resources/RPM-GPG-KEY-gnosisvpn
    dst: /etc/pki/rpm-gpg/RPM-GPG-KEY-gnosisvpn
    packager: rpm
    file_info:
      mode: 0644
      owner: root
      group: root
  # config|noreplace: a dpkg conffile, and %config(noreplace) on rpm so local edits survive upgrades.
  - src: ./linux/resources/gnosisvpn.env
    dst: /etc/gnosisvpn/gnosisvpn.env
    type: config|noreplace
    file_info:
      mode: 0644
  # One `type: config` entry per network in GNOSISVPN_NETWORKS, rendered by generate-package-linux.sh.
__GNOSIS_VPN_NETWORK_CONFIGS__
  # GeoIP database and Curvy proving file entries from linux/resources/, spliced by generate-package-linux.sh only on the GeoIP line.
__GNOSIS_VPN_LINE_EXTRAS__
  # Networks this package ships (space-separated, first = default); NOT a conffile, every upgrade must replace it.
  - src: ./build/resources/networks
    dst: /usr/share/gnosisvpn/networks
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: ./linux/resources/logrotate.conf
    dst: /etc/logrotate.d/gnosisvpn
    type: config|noreplace
    file_info:
      mode: 0644
      owner: root
      group: root
  # TCP BBR + fq; postinstall.sh applies it without a reboot.
  - src: ./linux/resources/sysctl-bbr.conf
    dst: /etc/sysctl.d/99-gnosisvpn-bbr.conf
    type: config|noreplace
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: ./linux/resources/gnosisvpn.service
    dst: /usr/lib/systemd/system/gnosisvpn.service
  - src: ./linux/resources/gnosisvpn-logrotate.service
    dst: /usr/lib/systemd/system/gnosisvpn-logrotate.service
  - src: ./linux/resources/gnosisvpn-logrotate.timer
    dst: /usr/lib/systemd/system/gnosisvpn-logrotate.timer
  # Rendered by generate-package-linux.sh: the GeoIP stanza is spliced in only when the build ships the database.
  - src: ./build/resources/copyright
    dst: /usr/share/doc/gnosisvpn/copyright
  - src: ./linux/resources/gnosisvpn.metainfo.xml
    dst: /usr/share/metainfo/com.gnosisvpn.gnosisvpnclient.metainfo.xml
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: ./build/changelog/changelog.gz
    dst: /usr/share/doc/gnosisvpn/changelog.gz
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: ./linux/resources/lintian-overrides
    dst: /usr/share/lintian/overrides/gnosisvpn
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root
  # Shell completions
  - src: ./build/completions/gnosis_vpn-ctl.bash
    dst: /usr/share/bash-completion/completions/gnosis_vpn-ctl
    file_info:
      mode: 0644
  - src: ./build/completions/gnosis_vpn-ctl.fish
    dst: /usr/share/fish/vendor_completions.d/gnosis_vpn-ctl.fish
    file_info:
      mode: 0644
  - src: ./build/completions/_gnosis_vpn-ctl
    dst: /usr/share/zsh/vendor-completions/_gnosis_vpn-ctl
    packager: deb
    file_info:
      mode: 0644
  - src: ./build/completions/_gnosis_vpn-ctl
    dst: /usr/share/zsh/site-functions/_gnosis_vpn-ctl
    packager: rpm
    file_info:
      mode: 0644
  # Manual pages
  - src: ./build/man/man1/gnosis_vpn-root.1.gz
    dst: /usr/share/man/man1/gnosis_vpn-root.1.gz
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: ./build/man/man1/gnosis_vpn-worker.1.gz
    dst: /usr/share/man/man1/gnosis_vpn-worker.1.gz
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: ./build/man/man1/gnosis_vpn-ctl.1.gz
    dst: /usr/share/man/man1/gnosis_vpn-ctl.1.gz
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: ./build/man/man1/gnosis_vpn-app.1.gz
    dst: /usr/share/man/man1/gnosis_vpn-app.1.gz
    file_info:
      mode: 0644
      owner: root
      group: root
__GNOSIS_VPN_APP_CONTENTS__
# Rendered from linux/scripts/ by generate-package-linux.sh, with scriptlet-lib.sh inlined.
scripts:
  preinstall: ./build/scripts/preinstall.sh
  postinstall: ./build/scripts/postinstall.sh
  preremove: ./build/scripts/preuninstall.sh
  postremove: ./build/scripts/postuninstall.sh
