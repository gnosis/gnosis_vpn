# Gnosis VPN — TCP BBR congestion control
#
# Installed by the gnosisvpn package as /etc/sysctl.d/99-gnosisvpn-bbr.conf.
# BBR paired with the fq queueing discipline noticeably improves throughput and
# latency of traffic carried over the mixnet tunnel. Both settings are
# system-wide, not VPN-specific.
#
# To disable, delete this file and reset the running values:
#   sudo rm /etc/sysctl.d/99-gnosisvpn-bbr.conf
#   sudo sysctl -w net.ipv4.tcp_congestion_control=cubic
#   sudo sysctl -w net.core.default_qdisc=fq_codel
#
# Settings in /etc/sysctl.conf take precedence over this file.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
