name: Close release
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version type after release
        required: true
        type: choice
        default: "patch"
        options:
          - patch
          - minor
          - major
      client_version:
        description: 'Client version to release (default: latest gnosis_vpn-client GitHub release)'
        required: false
        type: string
        default: ''
      app_version:
        description: 'App version to release (default: latest gnosis_vpn-app GitHub release)'
        required: false
        type: string
        default: ''
      toolkit_version:
        description: 'Toolkit version to release (default: latest gnosis_vpn-toolkit GitHub release)'
        required: false
        type: string
        default: ''
permissions:
  contents: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build_binary:
    name: Build
    uses: ./.github/workflows/build-binary.yaml
    with:
      version_type: release
      client_version: ${{ inputs.client_version }}
      app_version: ${{ inputs.app_version }}
      toolkit_version: ${{ inputs.toolkit_version }}
    secrets: inherit
  release:
    runs-on: depot-ubuntu-22.04-4
    name: Release
    needs: build_binary
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Nix
        uses: hoprnet/hopr-workflows/actions/setup-nix@21a781128e2796400ae2f17c955dc602c8bc1400 # setup-nix-v2.1.0
        with:
          cachix_cache_name: gnosis-vpn
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Display versions
        env:
          GNOSISVPN_PACKAGE_VERSION: ${{ needs.build_binary.outputs.GNOSISVPN_PACKAGE_VERSION }}
          GNOSISVPN_CLIENT_VERSION: ${{ needs.build_binary.outputs.GNOSISVPN_CLIENT_VERSION }}
          GNOSISVPN_APP_VERSION: ${{ needs.build_binary.outputs.GNOSISVPN_APP_VERSION }}
          GNOSISVPN_TOOLKIT_VERSION: ${{ needs.build_binary.outputs.GNOSISVPN_TOOLKIT_VERSION }}
        # ${VAR#v} guards against a double "v": component versions carry the
        # exact registry tag, which may or may not be v-prefixed.
        run: |
          echo "- Package version: v${GNOSISVPN_PACKAGE_VERSION#v}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- Client version: v${GNOSISVPN_CLIENT_VERSION#v}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- App version: v${GNOSISVPN_APP_VERSION#v}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- Toolkit version: v${GNOSISVPN_TOOLKIT_VERSION#v}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Generate Release Notes
        run: nix develop -c ./scripts/generate-changelog.ts
        env:
          GH_TOKEN: ${{ github.token }}
          GNOSISVPN_PACKAGE_VERSION: ${{ needs.build_binary.outputs.GNOSISVPN_PACKAGE_VERSION }}
          GNOSISVPN_CLIENT_VERSION: ${{ needs.build_binary.outputs.GNOSISVPN_CLIENT_VERSION }}
          GNOSISVPN_APP_VERSION: ${{ needs.build_binary.outputs.GNOSISVPN_APP_VERSION }}
          GNOSISVPN_TOOLKIT_VERSION: ${{ needs.build_binary.outputs.GNOSISVPN_TOOLKIT_VERSION }}
          GNOSISVPN_PREVIOUS_PACKAGE_VERSION: ${{ vars.GNOSISVPN_PACKAGE_RELEASE_VERSION }}
          GNOSISVPN_PREVIOUS_CLIENT_VERSION: ${{ vars.GNOSISVPN_CLIENT_RELEASE_VERSION }}
          GNOSISVPN_PREVIOUS_APP_VERSION: ${{ vars.GNOSISVPN_APP_RELEASE_VERSION }}
          GNOSISVPN_PREVIOUS_TOOLKIT_VERSION: ${{ vars.GNOSISVPN_TOOLKIT_RELEASE_VERSION }}
          GNOSISVPN_CHANGELOG_FORMAT: github
          # Aggregate PRs merged into the dispatching ref (e.g. a release branch)
          # rather than main, so close-release on a non-main branch produces release
          # notes that match what actually shipped on that branch. Only affects the
          # gnosis_vpn (installer) repo lookup; client/app PRs are aggregated from
          # their own repos with the default branch.
          GNOSISVPN_PACKAGE_BRANCH: ${{ github.ref_name }}
      - name: Generate GitHub App token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_GNOSISVPN_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_GNOSISVPN_BOT_PRIVATE_KEY }}
          owner: gnosis
      - name: Release version
        uses: hoprnet/hopr-workflows/actions/release-version@711c81d05909e2482d74289084502fb70fecc97b # release-version-v5.3.0
        with:
          source_branch: ${{ github.ref_name }}
          file: package.json
          release_type: ${{ inputs.release_type }}
          # The version bump runs in the bump_version job only after publish_apt
          # succeeded, so a failed release rolls back completely by deleting the
          # release and tag (no leftover "ci: Bump to version" commit).
          bump_version: 'false'
          cachix_cache_name: gnosis-vpn
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          zulip_api_key: ${{ secrets.GNOSIS_VPN_ZULIP_API_KEY }}
          zulip_email: ${{ secrets.GNOSIS_VPN_ZULIP_EMAIL }}
          zulip_channel: GnosisVPN
          zulip_topic: Releases
          gcp_workload_identity_provider: projects/656686060169/locations/global/workloadIdentityPools/gnosisvpn-gh-pool/providers/github-provider
          gcp_service_account: download-gnosisvpn-gh-sa@gnosisvpn-production.iam.gserviceaccount.com
          gcp_artifact_package: gnosis_vpn
          release_notes_file: ./build/changelog/changelog
          github_app_private_key: ${{ secrets.GH_APP_GNOSISVPN_BOT_PRIVATE_KEY }}
          github_app_client_id: ${{ secrets.GH_APP_GNOSISVPN_CLIENT_ID }}
  publish_apt:
    # Runs after `release` so apt never advertises a version without a matching GitHub release.
    name: Publish APT (stable)
    needs:
      - build_binary
      - release
    uses: ./.github/workflows/publish-apt.yaml
    with:
      channel: stable
      package_version: ${{ needs.build_binary.outputs.GNOSISVPN_PACKAGE_VERSION }}
    secrets: inherit
  prune_bucket:
    name: Prune bucket (stable)
    needs:
      - build_binary
      - publish_apt
    uses: ./.github/workflows/prune-bucket.yaml
    with:
      channel: stable
    secrets: inherit
  bump_version:
    # Runs only after publish_apt succeeded: until then nothing permanent touches
    # the branch, so rollback only needs to delete the release and tag.
    name: Bump version after successful release
    runs-on: depot-ubuntu-22.04-4
    needs:
      - build_binary
      - release
      - publish_apt
    steps:
      - name: Generate GitHub App token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_GNOSISVPN_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_GNOSISVPN_BOT_PRIVATE_KEY }}
          owner: gnosis
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.bot-token.outputs.token }}
      - name: Bump version
        uses: hoprnet/hopr-workflows/actions/bump-version@c9bedb08b91c847ad795173af5beaf2f3c37d1d4 # bump-version-v2.1.0
        with:
          file: package.json
          release_type: ${{ inputs.release_type }}
          github_token: ${{ steps.bot-token.outputs.token }}
      - name: Update release version variables
        shell: bash
        run: |
          gh variable set GNOSISVPN_PACKAGE_RELEASE_VERSION --body "${{ needs.build_binary.outputs.GNOSISVPN_PACKAGE_VERSION }}"
          gh variable set GNOSISVPN_CLIENT_RELEASE_VERSION --body "${{ needs.build_binary.outputs.GNOSISVPN_CLIENT_VERSION }}"
          gh variable set GNOSISVPN_APP_RELEASE_VERSION --body "${{ needs.build_binary.outputs.GNOSISVPN_APP_VERSION }}"
          gh variable set GNOSISVPN_TOOLKIT_RELEASE_VERSION --body "${{ needs.build_binary.outputs.GNOSISVPN_TOOLKIT_VERSION }}"
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
  rollback:
    name: Rollback release on failure
    runs-on: depot-ubuntu-22.04-4
    needs:
      - build_binary
      - release # the release does the tag and the gh release
      - publish_apt
    # No matter what, always run, only not if the release was skipped, or the publish_apt succeeded (in which case the release was successful)
    if: ${{ always() && needs.release.result != 'skipped' && needs.publish_apt.result != 'success' }}
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build_binary.outputs.GNOSISVPN_PACKAGE_VERSION }}
    steps:
      - name: Generate GitHub App token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_GNOSISVPN_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_GNOSISVPN_BOT_PRIVATE_KEY }}
          owner: gnosis
      - name: Delete release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION}" ]; then
            echo "No package version resolved; nothing to roll back." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag="v${VERSION}"
          echo "### Rolling back release ${tag}" | tee -a "$GITHUB_STEP_SUMMARY"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release delete "${tag}" --cleanup-tag --yes
            echo "- Deleted GitHub release and tag ${tag}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "- No release ${tag} found; checking for a dangling tag" | tee -a "$GITHUB_STEP_SUMMARY"
            if gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${tag}" >/dev/null 2>&1; then
              echo "- Deleted dangling tag ${tag}" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "- No tag ${tag} to delete" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
