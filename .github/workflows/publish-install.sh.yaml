name: Publish install.sh
on:
  push:
    branches: [main]
    paths:
      - install/linux.sh
      - .github/workflows/publish-install.sh.yaml
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: publish-install.sh
  cancel-in-progress: false
jobs:
  publish:
    name: Upload install.sh to download.gnosisvpn.io
    runs-on: depot-ubuntu-22.04-4
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup GCP
        uses: hoprnet/hopr-workflows/actions/setup-gcp@7263182fc9a2bab22cc5a029929940914eb9748d # setup-gcp-v4
        with:
          workload_identity_provider: projects/656686060169/locations/global/workloadIdentityPools/gnosisvpn-gh-pool/providers/github-provider
          service_account: download-gnosisvpn-gh-sa@gnosisvpn-production.iam.gserviceaccount.com
          install_sdk: true
      - name: Generate checksum
        run: |
          checksum=$(sha256sum install/linux.sh | cut -d' ' -f1)
          printf '%s  install.sh\n' "$checksum" >install/linux.sh.sha256
      - name: Upload install.sh
        run: |
          gsutil -h "Content-Type:text/x-shellscript; charset=utf-8" \
                 -h "Cache-Control:public, max-age=300" \
                 cp install/linux.sh gs://download.gnosisvpn.io/linux/install.sh
      - name: Upload install.sh.sha256
        run: |
          gsutil -h "Content-Type:text/plain; charset=utf-8" \
                 -h "Cache-Control:public, max-age=300" \
                 cp install/linux.sh.sha256 gs://download.gnosisvpn.io/linux/install.sh.sha256
