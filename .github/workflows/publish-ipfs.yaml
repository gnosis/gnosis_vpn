name: Publish IPFS (download page and binaries)
on:
  repository_dispatch:
    types: [trigger-merge]
  workflow_dispatch:
    inputs:
      propose_ens:
        description: Propose the ENS contenthash update to the owning Safe
        type: boolean
        default: true
      manifests_run_id:
        description: 'Update Manifests run to take manifests from (default: latest successful run)'
        required: false
        type: string
        default: ''
jobs:
  prep-ipfs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      # Whether this run should propose the ENS contenthash update — true only
      # for stable releases (see the "Resolve latest run IDs" step). Consumed
      # by the propose-ens job.
      from_release: ${{ steps.runs.outputs.from_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Generate GitHub App token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_GNOSISVPN_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_GNOSISVPN_BOT_PRIVATE_KEY }}
          owner: gnosis
      - name: Resolve latest run IDs
        id: runs
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          BOT_TOKEN_READ_ONLY_WEBSITES: ${{ secrets.BOT_TOKEN_READ_ONLY_WEBSITES }}
        run: |
          set -euo pipefail
          # The website 'downloads' app is uploaded per-commit as
          # build-downloads-<sha> (see _deploy-app.yml in the website repo), so
          # there is no stable artifact name to filter on. Match the
          # 'build-downloads-' prefix and take the most recent non-expired
          # artifact built on main, capturing both its run id and exact name.
          website_artifact=$(GH_TOKEN="$BOT_TOKEN_READ_ONLY_WEBSITES" gh api "repos/gnosis/gnosis_vpn-website_monorepo/actions/artifacts?per_page=100" \
            --jq '[.artifacts[]
                   | select(.expired == false)
                   | select(.workflow_run.head_branch == "main")
                   | select(.name | startswith("build-downloads-"))]
                  | sort_by(.created_at) | reverse | .[0]')
          if [ -z "$website_artifact" ] || [ "$website_artifact" = "null" ]; then
            echo "::error::No build-downloads-<sha> artifact found on main in gnosis_vpn-website_monorepo" >&2
            exit 1
          fi
          website_run=$(jq -r '.workflow_run.id' <<<"$website_artifact")
          website_name=$(jq -r '.name' <<<"$website_artifact")
          echo "website_run=$website_run" >> "$GITHUB_OUTPUT"
          echo "website_name=$website_name" >> "$GITHUB_OUTPUT"
          # Binaries come from this repo's latest successful "Close release" run.
          release_run=$(GH_TOKEN="${{ github.token }}" gh run list --workflow release.yaml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "release_run=$release_run" >> "$GITHUB_OUTPUT"
          # Manifests come from this repo's "Update Manifests" workflow: the run
          # that dispatched us when given, its latest successful run otherwise.
          manifests_run='${{ inputs.manifests_run_id }}'
          if [ -z "$manifests_run" ]; then
            manifests_run=$(GH_TOKEN="${{ github.token }}" gh run list --workflow update-manifests.yaml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          echo "manifests_run=$manifests_run" >> "$GITHUB_OUTPUT"
          # ENS is proposed only for stable releases: Update Manifests dispatches
          # this workflow with propose_ens=true after a successful "Close release".
          # repository_dispatch (website republish) never proposes.
          from_release=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            from_release='${{ inputs.propose_ens }}'
          fi
          echo "from_release=$from_release" >> "$GITHUB_OUTPUT"
      - name: Download Website Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.runs.outputs.website_name }}
          path: ./merged-build/website/
          repository: gnosis/gnosis_vpn-website_monorepo
          run-id: ${{ steps.runs.outputs.website_run }}
          github-token: ${{ secrets.BOT_TOKEN_READ_ONLY_WEBSITES }}
      - name: Download Binary Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./merged-build/binary/
          run-id: ${{ steps.runs.outputs.release_run }}
          github-token: ${{ github.token }}
          merge-multiple: true
      - name: Download Manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: manifests
          path: ./merged-build/manifests/
          run-id: ${{ steps.runs.outputs.manifests_run }}
          github-token: ${{ github.token }}
      - name: Substitute website placeholders
        run: |
          set -euo pipefail
          manifests=./merged-build/manifests
          website=./merged-build/website

          # jq -e fails on missing/null values; set -e then aborts the step.
          version=$(jq -er '.channels.stable.version' "$manifests/macos-arm64.ipfs.json")
          url_mac_arm=$(jq -er '.channels.stable.download_url' "$manifests/macos-arm64.ipfs.json")
          url_linux_amd64=$(jq -er '.channels.stable.download_url' "$manifests/linux-amd64.ipfs.json")
          url_linux_arm64=$(jq -er '.channels.stable.download_url' "$manifests/linux-arm64.ipfs.json")

          # All three manifests must agree on the stable version.
          for m in linux-amd64 linux-arm64; do
            v=$(jq -er '.channels.stable.version' "$manifests/$m.ipfs.json")
            [ "$v" = "$version" ] || { echo "::error::Version mismatch: $m has $v, macos-arm64 has $version"; exit 1; }
          done

          # Binaries ship in the same IPFS build, so links are origin-relative:
          # strip the ENS host prefix (IPFS_BASE_URL in scripts/generate-update-manifest.sh).
          url_mac_arm=${url_mac_arm#download.vpn.gnosis.eth/}
          url_linux_amd64=${url_linux_amd64#download.vpn.gnosis.eth/}
          url_linux_arm64=${url_linux_arm64#download.vpn.gnosis.eth/}

          # Values land inside JS template literals in the bundle and inside a
          # sed replacement — restrict to characters safe for both.
          for val in "$version" "$url_mac_arm" "$url_linux_amd64" "$url_linux_arm64"; do
            [[ "$val" =~ ^[A-Za-z0-9./_+-]+$ ]] || { echo "::error::Unsafe or empty manifest value: '$val'"; exit 1; }
          done

          # Tolerate a website artifact that predates the placeholders
          # (publish-timing skew between the two repos): warn and skip.
          files=$(grep -rl -e '<VERSION>' -e '<URL_MAC_ARM>' -e '<URL_LINUX_AMD64>' -e '<URL_LINUX_ARM64>' "$website" || true)
          if [ -z "$files" ]; then
            echo "::warning::No placeholder tokens found in the website build — skipping substitution."
            exit 0
          fi

          echo "$files" | while read -r f; do
            sed -i \
              -e "s|<VERSION>|$version|g" \
              -e "s|<URL_MAC_ARM>|$url_mac_arm|g" \
              -e "s|<URL_LINUX_AMD64>|$url_linux_amd64|g" \
              -e "s|<URL_LINUX_ARM64>|$url_linux_arm64|g" \
              "$f"
            echo "Substituted placeholders in $f"
          done

          # No token may survive.
          if grep -rn -e '<VERSION>' -e '<URL_MAC_ARM>' -e '<URL_LINUX_AMD64>' -e '<URL_LINUX_ARM64>' "$website"; then
            echo "::error::Placeholder tokens remain after substitution."
            exit 1
          fi
      - name: Setup GCP
        uses: hoprnet/hopr-workflows/actions/setup-gcp@ade4bbd75f7204255c61d19c23f67d3da221e7d2 # setup-gcp-v4
        with:
          workload_identity_provider: projects/656686060169/locations/global/workloadIdentityPools/gnosisvpn-gh-pool/providers/github-provider
          service_account: download-gnosisvpn-gh-sa@gnosisvpn-production.iam.gserviceaccount.com
          install_sdk: true
      - name: Download APT index
        run: |
          for path in linux/apt/dists/stable; do
            mkdir -p "./merged-build/apt/${path}"
            gsutil -m rsync -r "gs://download.gnosisvpn.io/${path}" "./merged-build/apt/${path}"
          done
          # Keyring apt clients use to verify the repository signature.
          gsutil cp "gs://download.gnosisvpn.io/linux/apt/gnosisvpn-archive-keyring.gpg" "./merged-build/apt/linux/apt/gnosisvpn-archive-keyring.gpg"
      - name: Merge Folders
        run: |
          mkdir -p ./ipfs
          mkdir -p ./ipfs/keys
          mkdir -p ./ipfs/manifests
          mkdir -p ./ipfs/macos/stable
          mkdir -p ./ipfs/linux/apt/pool/main/g/gnosisvpn

          cp -r ./merged-build/website/* ./ipfs/
          cp -r ./merged-build/apt/* ./ipfs/
          cp ./merged-build/binary/*.deb* ./ipfs/linux/apt/pool/main/g/gnosisvpn/
          cp ./merged-build/binary/*.pkg* ./ipfs/macos/stable/
          cp -r ./merged-build/manifests/* ./ipfs/manifests/
          cp ./gnosisvpn-public-key.asc ./ipfs/keys/
          cp ./install/linux.sh ./ipfs/linux/install.sh
          checksum=$(sha256sum ./install/linux.sh | cut -d' ' -f1)
          printf '%s  install.sh\n' "$checksum" >./ipfs/linux/install.sh.sha256

          ls -la ./ipfs/
          ls -la ./ipfs/macos/stable/
          ls -la ./ipfs/linux/
      - name: Upload IPFS build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ipfs-${{ github.sha }}
          path: ./ipfs
  deploy-ipfs:
    needs: [prep-ipfs]
    uses: gnosis/gh-action-pinata/.github/workflows/pinata-deployment.yml@6197bbf8ffd6bee0d4ddb633af27633ca80a6a26 # 0.2.0
    with:
      environment: prod
      project_name: gnosis-vpn-downloads
      build_dir: ./ipfs
      build_artifact_name: ipfs-${{ github.sha }}
    secrets:
      PINATA_JWT: ${{ secrets.PINATA_JWT }}
  propose-ens:
    needs: [prep-ipfs, deploy-ipfs]
    # Only propose the ENS update for stable releases.
    if: ${{ needs.prep-ipfs.outputs.from_release == 'true' }}
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 10
    steps:
      - name: Propose ENS contenthash update
        uses: hoprnet/hopr-workflows/actions/propose-ens-contenthash@ade4bbd75f7204255c61d19c23f67d3da221e7d2 # propose-ens-contenthash-v1
        with:
          cid: ${{ needs.deploy-ipfs.outputs.ipfs_hash }}
          ens_name: ${{ vars.ENS_NAME }}
          resolver_address: ${{ vars.RESOLVER_ADDRESS }}
          safe_address: ${{ vars.SAFE_ADDRESS }}
          ens_delegate_private_key: ${{ secrets.ENS_DELEGATE_PRIVATE_KEY }}
          safe_api_key: ${{ secrets.SAFE_API_KEY }}
          tx_origin: 'gnosis_vpn/publish-ipfs'
